{% extends "base.html" %}
{% block content %}
<header class="page-head"><h1>往期</h1></header>
<div class="search-row"><label class="sr-only" for="site-search">检索全部文献</label><input class="search" id="site-search" placeholder="检索题名、作者或正文" type="search" autocomplete="off" data-global-search="../search-index.json"></div>
<div id="global-results" aria-live="polite" class="global-results"></div>
<section class="issue-list">
  {% for item in issues %}<a class="archive-row" href="../issues/{{ item.id }}.html"><time>{{ item.date }}</time><span>{{ item.issue_no }}</span><span class="count">{{ item.records|length }}篇</span></a>{% endfor %}
</section>
{% if samples %}<section class="issue-list samples">{% for item in samples %}<a class="archive-row" href="../issues/{{ item.id }}.html"><time>{{ item.date }}</time><span>{{ item.issue_no }}</span><span class="count">样刊</span></a>{% endfor %}</section>{% endif %}
{% endblock %}
