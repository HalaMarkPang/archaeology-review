name: Friday archaeological research
on:
  schedule:
    - cron: '37 18 * * 5'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: friday-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover journal metadata and publication leads
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/discover.py
      - name: Validate evidence and publish eligible abstracts
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          MODEL_API_BASE_URL: ${{ vars.MODEL_API_BASE_URL }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'candidates_only' }}
        run: python scripts/review.py
      - name: Commit metadata, audit and eligible issues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/candidates content/audits content/status.json content/issues
          if ! git diff --cached --quiet; then
            git commit -m "research: weekly reviewed candidates and audit"
            git push
          else
            echo "No changed research output"
          fi
