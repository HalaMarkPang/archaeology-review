# 运行时刻须与 config/discovery.json 的 schedule.cron、schedule.timezone 一致。
name: Friday archaeological research
on:
  schedule:
    - cron: '0 12 * * 5'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: friday-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Discover journal metadata and publication leads
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python scripts/discover.py
      - name: Prepare source packet for model writing
        run: python scripts/editorial.py
      - name: Record candidate dispositions without publishing unreviewed text
        run: python scripts/review.py
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build.py
      - name: Preserve local editorial source packet
        uses: actions/upload-artifact@v4
        with:
          name: editorial-packet-${{ github.run_id }}
          path: |
            .cache/discovery.json
            .cache/editorial-packet.json
          include-hidden-files: true
          retention-days: 14
      - name: Commit metadata, audit and eligible issues
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/candidates content/audits content/status.json content/issues
          if ! git diff --cached --quiet; then
            git commit -m "research: weekly reviewed candidates and audit"
            git push
          else
            echo "No changed research output"
          fi

      - name: Trigger GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
